name: Development task
description: A scoped implementation, research, or testing task
title: "[TASK] "
labels: ["task"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What outcome should this task produce?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: List the concrete work items.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we verify this is done?
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / risks
      description: Note prerequisites, licence checks, API limits, or risks.
    validations:
      required: false
